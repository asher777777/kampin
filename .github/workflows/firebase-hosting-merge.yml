name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Create .env.production
        run: |
          cat << 'EOF' > .env.production
          ${{ secrets.ENV_PRODUCTION }}
          EOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_C_G_LTD }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:kampin --non-interactive --project c-g-ltd
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
