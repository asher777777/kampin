name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Create .env.production
        run: |
          cat << 'EOF' > .env.production
          ${{ secrets.ENV_PRODUCTION }}
          AUTH_SECRET=4c30c8df634f19b22a6bbffeb5e4d2938a16dbd76eaef6b3992b158021b777a8
          AUTH_TRUST_HOST=true
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=c-g-ltd
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=c-g-ltd.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=c-g-ltd.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAhqcOjsn9Vq2xpmhtw1IdFwP3-zn3cD7I
          EOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_C_G_LTD }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:kampin --non-interactive --project c-g-ltd
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          PUPPETEER_SKIP_DOWNLOAD: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
